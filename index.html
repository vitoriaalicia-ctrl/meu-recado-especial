
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Um recadinho pra você ♡</title>
<style>
body {
  margin: 0;
  padding: 25px;
  background: #f8f2ef;
  font-family: Arial, sans-serif;
  color: #57474b;
}
.note {
  max-width: 440px;
  margin: 30px auto;
  padding-bottom: 20px;
  background: #fffdf9;
  border: 1px solid #eadbd7;
  border-radius: 18px;
  overflow: hidden;
}
header {
  padding: 24px;
  background: #f2e5e2;
  color: #805d61;
  font-size: 19px;
  font-weight: bold;
}
main {
  padding: 24px;
  line-height: 2;
  font-size: 17px;
}
.heart {
  text-align: right;
  color: #b77f87;
}
</style>
</head>
<body>
<div class="note">
<header>♡ Um recadinho pra você</header>
<main>
<p>você foi a melhor coisa que me aconteceu esse ano.</p>
<p>amo nossos momentos e amo mais ainda você.</p>
<p>queria ser um cadinho brega hoje pq tô com saudade 😬</p>
<p>ps: vc tem muita sorte… em me ter 🥰</p>
<div class="heart">♡</div>
</main>
</div>
</body>
</html>
