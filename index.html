
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Um recadinho pra você ♡</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; padding: 24px;
  display: flex; align-items: center; justify-content: center;
  background: #f8f2ef;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #57474b;
}
.note {
  width: 100%; max-width: 440px; padding-bottom: 24px;
  background: #fffdf9; border: 1px solid #eadbd7;
  border-radius: 18px; overflow: hidden;
  box-shadow: 0 12px 35px #79565b12;
}
header {
  padding: 24px; background: #f2e5e2;
  color: #805d61; font-size: 19px; font-weight: 600;
}
main {
  padding: 24px;
  background: repeating-linear-gradient(
    to bottom, transparent 0, transparent 43px, #f0e7e2 44px
  );
  font-size: 17px; line-height: 2;
}
p { margin: 0 0 18px; }
.heart { text-align: right; color: #b77f87; }
</style>
</head>
<body>
<article class="note">
<header>♡ &nbsp; um recadinho pra você</header>
<main>
<p>você foi a melhor coisa que me aconteceu esse ano.</p>
<p>amo nossos momentos e amo mais ainda você.</p>
<p>queria ser um cadinho brega hoje&nbsp; pq tô com saudade 😬</p>
<p>ps: vc tem muita sorte… em me ter 🥰</p>
<div class="heart">♡</div>
</main>
</article>
</body>
</html>
